name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build libraries
        run: npm run build

      - name: Build demo
        run: npm run build:demo

      - name: Pack check (publint, types, dry-run pack)
        run: npm run pack:check

      - name: Consumer smoke test (packed tarballs in a fresh project)
        run: npm run test:consumer

  visual:
    name: Visual (GPU parity, materials, screenshots)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual tests (software WebGL)
        run: npm run test:visual

      - name: Upload sensor view screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensor-views
          path: |
            packages/cameras/artifacts/visual
            packages/cameras/test-results
          if-no-files-found: ignore

  opencv:
    name: OpenCV reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install reference package
        run: npm run setup:python

      - name: Verify OpenCV
        run: npm run verify:opencv

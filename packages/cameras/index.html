<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Intrinsic Lens-Distortion Cameras</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      .layout {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
      }

      .toolbar h1 {
        font-size: 1rem;
        font-weight: 600;
      }

      .model-picker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      .model-picker select {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
      }

      .subtitle {
        font-size: 0.8rem;
        color: #999;
      }

      .panels {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .panel h2 {
        font-size: 0.75rem;
        font-weight: 500;
        color: #888;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #222;
        flex-shrink: 0;
      }

      .projection-panel {
        flex: 1;
        border-right: 1px solid #333;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: auto;
      }

      #projection-canvas {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        border: 1px solid #333;
        background: #0a0a0a;
      }

      .scene-panel {
        flex: 1.6;
        min-height: 0;
        overflow: hidden;
      }

      /* Views + custom-camera form scroll together inside the panel. */
      .scene-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }

      .tiles {
        flex: none;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        padding: 0.5rem;
        align-content: start;
      }

      .tile {
        border: 1px solid #333;
        border-radius: 4px;
        overflow: hidden;
      }

      .tile.selected {
        border-color: #44ccff;
      }

      .tile-label {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        background: #1a1a1a;
        color: #bbb;
      }

      .tile-view {
        position: relative;
        aspect-ratio: 4 / 3;
      }

      .tile-view canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .tile-view .overlay {
        pointer-events: none;
      }

      .custom-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        padding: 0 0.5rem 0.5rem;
        align-items: start;
      }

      .custom-form {
        border: 1px solid #333;
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }

      .custom-form h3 {
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
      }

      .custom-form .hint {
        color: #888;
        margin-bottom: 0.5rem;
      }

      .custom-form code {
        color: #bbb;
      }

      .custom-form .fields {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
        gap: 0.4rem;
      }

      .custom-form label {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        color: #aaa;
      }

      .custom-form input,
      .custom-form select {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.25rem 0.4rem;
        width: 100%;
      }

      .custom-form fieldset {
        border: 1px solid #333;
        border-radius: 4px;
        padding: 0.4rem;
        margin-top: 0.5rem;
      }

      .custom-form legend {
        color: #888;
        padding: 0 0.25rem;
      }

      .custom-form .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.6rem;
      }

      .custom-form button {
        background: #1d4f7a;
        color: #fff;
        border: 1px solid #2f77b3;
        border-radius: 4px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
      }

      .custom-form button[type='button'] {
        background: #222;
        border-color: #444;
        color: #ddd;
      }

      .status {
        margin-top: 0.5rem;
        min-height: 1.2em;
      }

      .status.ok {
        color: #5fd38a;
      }

      .status.warn {
        color: #f0c060;
      }

      .status.error {
        color: #ff7a7a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

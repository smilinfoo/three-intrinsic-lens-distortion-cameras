<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three-Camera Intrinsics and Distortion Lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }

      .layout {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
      }

      .toolbar h1 {
        font-size: 1rem;
        font-weight: 600;
      }

      .model-picker {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      .model-picker select {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.25rem 0.5rem;
      }

      .subtitle {
        font-size: 0.8rem;
        color: #999;
      }

      .panels {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .panel h2 {
        font-size: 0.75rem;
        font-weight: 500;
        color: #888;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid #222;
        flex-shrink: 0;
      }

      .projection-panel {
        flex: 1;
        border-right: 1px solid #333;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: auto;
      }

      #projection-canvas {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        border: 1px solid #333;
        background: #0a0a0a;
      }

      .scene-panel {
        flex: 1;
      }

      #three-container {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

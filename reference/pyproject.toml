[project]
name = "camera-lab-ref"
version = "0.1.0"
description = "OpenCV reference implementation for three-camera-lab"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
]

[project.scripts]
verify-opencv = "camera_lab_ref.verify_opencv:main"
generate-fixtures = "camera_lab_ref.generate_fixtures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_lab_ref"]
